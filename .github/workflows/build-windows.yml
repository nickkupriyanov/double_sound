name: Build Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Ensure fpcalc
        shell: pwsh
        run: |
          if (-not (Test-Path "app/resources/fpcalc.exe")) {
            $url = "https://github.com/acoustid/chromaprint/releases/download/v1.6.2/chromaprint-fpcalc-1.6.2-windows-x86_64.zip"
            Invoke-WebRequest -Uri $url -OutFile "fpcalc.zip"
            Expand-Archive -Path "fpcalc.zip" -DestinationPath "fpcalc_tmp" -Force
            $exe = Get-ChildItem -Path "fpcalc_tmp" -Recurse -Filter "fpcalc.exe" | Select-Object -First 1
            Copy-Item $exe.FullName "app/resources/fpcalc.exe"
            Remove-Item "fpcalc.zip", "fpcalc_tmp" -Recurse -Force
          }

      - name: Run tests
        run: python -m pytest -q

      - name: Build portable app
        run: python -m PyInstaller --noconfirm --clean double_sound.spec

      - name: Pack zip
        shell: pwsh
        run: Compress-Archive -Path "dist/DoubleSound/*" -DestinationPath "dist/DoubleSound-win64.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: DoubleSound-win64
          path: dist/DoubleSound-win64.zip
